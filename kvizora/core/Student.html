<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js" onload="window.__mhchem=true"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" onload="window.__katexReady=true; if(window.__mathPending){window.__mathPending();}"></script>
<style>
  :root {
    --bg: #f4f2ef; --card: #ffffff; --ink: #1d1b1a; --muted: #6b6560; --line: #e3ded8;
    --brand: #b3121f; --brand-ink: #ffffff; --accent: #0f6d8c; --accent-soft: #e3f1f6;
    --ok: #1d7a46; --warn: #a15c00; --warn-soft: #fbefdc; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #1f1d1c; --ink: #f1eeea; --muted: #a49d96; --line: #34302d;
      --brand: #c8303c; --accent: #59b7d6; --accent-soft: #17323c; --ok: #4fc283; --warn: #e3a64a; --warn-soft: #3a2a12;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink);
    background-image: radial-gradient(circle at 85% 30%, rgba(255,255,255,.12) 0 2px, transparent 3px), linear-gradient(115deg, transparent 60%, rgba(0,0,0,.12) 60%);
    padding: 24px 16px; }
  header .wrap, .topbar .wrap, main { max-width: 680px; margin: 0 auto; }
  header h1 { margin: 0; font-size: clamp(20px, 5vw, 30px); line-height: 1.15; font-weight: 800; }
  main { padding: 0 16px 40px; }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .topbar .wrap { display: flex; align-items: center; gap: 12px; }
  .topbar .who { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 800; padding: 4px 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .timer.low { background: var(--warn-soft); color: var(--warn); }
  .pbar { height: 5px; background: var(--line); } .pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .3s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-top: 18px; }
  .step-label { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .4px; }
  .qcount { color: var(--muted); font-size: 13px; float: right; }
  label.field { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  textarea { resize: vertical; min-height: 64px; }
  .numinput { max-width: 280px; font-size: 19px; font-variant-numeric: tabular-nums; }
  .numinput.chem { max-width: 100%; }
  .chem-prev { margin-top: 8px; color: var(--muted); font-size: 15px; min-height: 22px; }
  .chem-prev b { color: var(--ink); font-weight: 600; font-size: 18px; letter-spacing: .3px; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .katex { font-size: 1.05em; }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  .rules-title { font-weight: 700; margin: 18px 0 0; }
  .rules { margin: 8px 0 0; padding: 14px 14px 14px 32px; background: var(--bg); border-radius: 10px; }
  .rules li { margin: 5px 0; }
  .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 14px; cursor: pointer; }
  .consent input { width: 20px; height: 20px; margin: 2px 0 0; flex: 0 0 auto; }
  .qtext { font-size: 19px; margin: 14px 0 16px; }
  .gap { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--accent); text-align: center; font-weight: 700; color: var(--accent); padding: 0 4px; }
  .gap.empty { border-bottom-color: var(--muted); color: var(--muted); }
  .instr { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .orig { color: var(--muted); font-size: 15px; margin: 12px 0 10px; }
  .opts { display: grid; gap: 10px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opt > span { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
  .opt > span > b { color: var(--muted); width: 22px; flex: 0 0 auto; }
  .opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
  .opt input:checked + span > b { color: var(--accent); }
  .reset { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 6px 0 0; cursor: pointer; }
  .nav { display: flex; gap: 12px; align-items: center; margin-top: 22px; }
  .nav .spacer { flex: 1; }
  button.primary { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 26px; background: linear-gradient(135deg, var(--brand), #d64550); color: #fff; cursor: pointer; min-height: 48px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  button.primary.alt { background: linear-gradient(135deg, var(--accent), #0a5a74); }
  button.ghost { font: inherit; font-weight: 600; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); border-radius: 10px; padding: 11px 18px; cursor: pointer; min-height: 48px; }
  button.ghost:hover { border-color: var(--brand); color: var(--brand); }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.primary.wide { width: 100%; }
  .langtog { display: inline-flex; border: 1.5px solid rgba(255,255,255,.5); border-radius: 99px; overflow: hidden; flex: 0 0 auto; }
  .langtog button { font: inherit; font-weight: 700; font-size: 13px; border: 0; background: transparent; color: #fff; padding: 6px 12px; cursor: pointer; min-height: 36px; }
  .langtog button.on { background: #fff; color: var(--brand); }
  .langtog button:disabled { opacity: .35; cursor: default; }
  .miss { font-size: 12px; color: var(--muted); font-style: italic; margin: -6px 0 10px; }
  .trbtn { background: none; border: 1.5px dashed var(--accent); color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 6px 12px; cursor: pointer; margin: 0 0 12px; }
  .trbox { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 15px; }
  .trbox b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .err { color: var(--warn); font-size: 14px; margin-top: 10px; min-height: 20px; }
  .center { text-align: center; padding: 44px 18px; }
  .big { font-size: 56px; line-height: 1; }
  .center h2 { margin: 14px 0 6px; font-size: 22px; }
  .countdown { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 12px 0; color: var(--accent); }
  .score { font-size: 42px; font-weight: 800; margin: 8px 0; }
  .hint { color: var(--muted); font-size: 14px; }
  .picker a { display: block; text-decoration: none; color: inherit; border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 10px; font-weight: 600; }
  .picker a:hover { border-color: var(--accent); background: var(--accent-soft); }
  .picker .folder { font-size: 12px; color: var(--muted); font-weight: 400; }
  .hidden { display: none !important; }
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); max-width: 340px; padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog p { margin-top: 0; }
  dialog .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .qimg { display: block; max-width: 100%; max-height: 380px; margin: 0 auto 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .match { display: grid; }
  .mrow { display: grid; grid-template-columns: minmax(70px, 1fr) 2fr; gap: 6px 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mleft { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .mrow select { width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
  .mrow select:focus { outline: none; border-color: var(--accent); }
  .mrow select.set { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 480px) { .mrow { grid-template-columns: 1fr; } }
  /* equations: the student solves line by line */
  .eqbox { font-size: 1.2em; text-align: center; margin: 4px 0 14px; padding: 12px; background: var(--accent-soft); border-radius: 12px; overflow-x: auto; }
  .sublbl { font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
  .steps { display: grid; gap: 8px; }
  .srow { display: grid; grid-template-columns: 26px minmax(0, 1fr) 40px; gap: 6px; align-items: start; }
  .srow .sn { color: var(--muted); padding-top: 12px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .srow input { font-size: 17px; }
  .sprev { min-height: 1.5em; font-size: 15px; padding: 3px 4px 0; overflow-x: auto; color: var(--ink); }
  .sprev.bad { color: var(--warn); font-size: 13px; }
  .sprev.note { color: var(--muted); font-size: 13px; }
  .iconbtn { font: inherit; min-width: 40px; min-height: 44px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); border-radius: 10px; cursor: pointer; }
  .iconbtn:hover { color: var(--ink); border-color: var(--muted); }
  .linkbtn { font: inherit; font-size: 14px; border: 1.5px dashed var(--line); background: none; color: var(--accent); border-radius: 10px; padding: 8px 12px; cursor: pointer; margin-top: 8px; }
  .mkbd { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
  .mkbd button { font: inherit; font-size: 16px; min-width: 42px; min-height: 40px; padding: 0 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; cursor: pointer; }
  .mkbd button:active { background: var(--accent-soft); }
  .roots { display: grid; gap: 8px; }
  .rootrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rootrow label { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .rootrow input[type=text] { width: 150px; font-size: 17px; }
  .rflags { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 15px; }
  .rflags label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .rflags input { width: 18px; height: 18px; }
  /* tools the teacher gave for this test */
  .tbtools { display: flex; gap: 4px; }
  .tbtools button { font-size: 17px; width: 36px; height: 34px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; cursor: pointer; padding: 0; line-height: 1; }
  .tbtools button.on { background: var(--accent-soft); border-color: var(--accent); }
  .twin { position: fixed; z-index: 40; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.22); max-width: calc(100vw - 16px); display: flex; flex-direction: column; }
  .twin .th { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; cursor: move; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; touch-action: none; user-select: none; }
  .twin .th span { flex: 1; }
  .twin .th button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; width: 32px; height: 30px; }
  .twin .tb { padding: 10px; overflow: auto; }
  .calc .disp { font-size: 18px; text-align: right; }
  .calc .res { text-align: right; font-size: 22px; font-weight: 700; min-height: 32px; font-variant-numeric: tabular-nums; overflow-x: auto; }
  .calc .res.err { color: var(--warn); font-size: 15px; font-weight: 600; }
  .calc .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 6px; }
  .calc .keys button { font: inherit; min-height: 38px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; cursor: pointer; padding: 0; }
  .calc .keys button.op { color: var(--accent); font-weight: 700; }
  .calc .keys button.eq { background: var(--accent); color: #fff; border-color: var(--accent); }
  .calc .hist { font-size: 13px; color: var(--muted); max-height: 60px; overflow: auto; text-align: right; }
  .graph canvas { display: block; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; touch-action: none; cursor: grab; }
  .graph .grow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .graph .grow input { flex: 1; padding: 8px 10px; }
  .graph .gst { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .graph .gst.err { color: var(--warn); }
  .sheet div { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .sheet div:last-child { border-bottom: 0; }
  .instrument { position: fixed; z-index: 45; touch-action: none; user-select: none; cursor: move; }
  .instrument svg { display: block; overflow: visible; }
  .instrument .rot { cursor: grab; }
  .instrument .angle { position: absolute; font: 700 12px system-ui, sans-serif; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<header><div class="wrap" style="display:flex;align-items:center;gap:12px"><h1 id="title" style="flex:1;margin:0">Online Test</h1><div class="langtog" id="langTog"><button data-l="uk" id="lang-uk">УКР</button><button data-l="en" id="lang-en">EN</button></div></div></header>
<div class="topbar hidden" id="topbar"><div class="wrap"><span class="who" id="who"></span><span class="tbtools hidden" id="tbTools"></span><span class="timer hidden" id="timer"></span></div></div>
<div class="pbar hidden" id="pbarWrap"><i id="pbar" style="width:0"></i></div>

<main>
  <div id="msgView"><div class="card center">
    <div class="big" id="msgIcon">⏳</div><h2 id="msgTitle">Loading…</h2><p class="hint" id="msgText"></p>
    <div class="countdown hidden" id="msgCountdown"></div>
    <div class="picker hidden" id="picker"></div>
    <p><button class="primary hidden" id="msgRetry" style="margin-top:8px">Try again</button></p>
  </div></div>

  <div id="intro" class="hidden"><div class="card">
    <div class="row2">
      <div><label class="field" for="name" id="nameLabel">Your name *</label><input id="name" type="text" autocomplete="name" maxlength="80" placeholder="First and last name"></div>
      <div><label class="field" for="group" id="classLabel">Class</label><input id="group" type="text" maxlength="40" placeholder="e.g. 9B" list="classOpts" autocomplete="off"><datalist id="classOpts"></datalist></div>
    </div>
    <p class="rules-title" id="rulesTitle">Before you start — please read:</p>
    <ul class="rules" id="rules"></ul>
    <label class="consent" id="consentWrap"><input type="checkbox" id="consent"><span id="consentText">I have read the rules above and I agree.</span></label>
    <button class="primary wide" id="startBtn" style="margin-top:14px">Start the test</button>
    <div class="err" id="startErr"></div>
  </div></div>

  <div id="quiz" class="hidden"><div class="card" id="qcard"></div>
    <div class="nav"><button class="ghost" id="finishBtn" type="button">Finish test</button><div class="spacer"></div><button class="primary alt" id="nextBtn">Next →</button></div>
    <div class="err" id="quizErr"></div>
  </div>

  <div id="doneView" class="hidden"><div class="card center">
    <div class="big" style="color:var(--ok)">✓</div><h2 id="doneTitle">Your answers were sent</h2>
    <p id="doneName"></p>
    <div id="doneScore" class="hidden"><div class="score" id="scoreTotal"></div></div>
    <p class="hint" id="doneClose">You can close this page now.</p>
  </div></div>
</main>

<dialog id="confirm"><p id="confirmText"></p><div class="acts"><button class="primary" id="cBack" style="background:var(--muted)">Go back</button><button class="primary" id="cSend">Submit</button></div></dialog>

<script>
// ==== MATHKIT BEGIN — the same block is in Code.gs, Student.html and Teacher.html (tools/sync-mathkit.js copies it; do not edit the copies) ====
/**
 * MathKit: reads what a student types in maths ("2x+5=17", "x² − 5x + 6 = 0", "√(x+3) = x − 3", "x = ±3",
 * "(x+1)/2 = 3", "|x − 2| = 5", "2^x = 8"), draws it as LaTeX, evaluates it and finds the roots of an equation.
 * No eval(): a small parser of its own. Plain ES5, so it runs in Apps Script, on the Node server and in old phone browsers.
 *   MK.parseExpr(s)        → tree (throws Error with .mk = reason code)
 *   MK.parseLine(s)        → { kind: 'eqs', parts: [[side tree, side tree, …], …] } | { kind: 'note' }   (a step line)
 *   MK.tex(tree), MK.lineTex(s) → LaTeX for the preview
 *   MK.evalStr(s, env)     → number (NaN when it makes no sense)
 *   MK.key(eqs, vars, accept) → the solution of an equation or a system { vars, sols, none, all, err }
 *   MK.checkLine(s, key)   → 'ok' | 'extra' | 'lost' | 'wrong' | 'bad' | 'skip' | 'note'   (one step of a student's working)
 *   MK.sameSols(a, b)      → do two solution lists match
 */
var MK = (function () {
  'use strict';
  var FUNS = ['arcsin', 'arccos', 'arctan', 'arctg', 'sqrt', 'cbrt', 'root', 'sin', 'cos', 'tan', 'cot', 'ctg', 'abs', 'log', 'exp', 'tg', 'ln', 'lg'];
  var SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
  var SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  var TOL = 1e-7;
  function fail(code) { var e = new Error('MK:' + code); e.mk = code; return e; }

  /** Tidy what was typed: LaTeX from the teacher, Unicode signs, decimal commas, Cyrillic х/у, superscripts. */
  function prep(s) {
    s = String(s == null ? '' : s).replace(/\$/g, ' ');
    var prev;
    do {   // LaTeX, innermost first
      prev = s;
      s = s.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '(($1)/($2))')
           .replace(/\\sqrt\s*\[\s*3\s*\]\s*\{([^{}]*)\}/g, '∛($1)')
           .replace(/\\sqrt\s*\{([^{}]*)\}/g, '√($1)')
           .replace(/\^\s*\{([^{}]*)\}/g, '^($1)')
           .replace(/_\s*\{([^{}]*)\}/g, '_($1)')
           .replace(/\\left\s*\||\\right\s*\|/g, '|')
           .replace(/\\text\s*\{([^{}]*)\}/g, '$1');
    } while (s !== prev);
    s = s.replace(/\\left|\\right|\\,|\\;|\\!|\\quad/g, ' ').replace(/\\cdot|\\times|\\ast/g, '*').replace(/\\div/g, '/')
         .replace(/\\pm/g, '±').replace(/\\mp/g, '∓').replace(/\\pi/g, 'π').replace(/\\sqrt/g, '√')
         .replace(/\\(leq?|le)\b/g, '≤').replace(/\\(geq?|ge)\b/g, '≥').replace(/\\neq?\b/g, '≠')
         .replace(/\\(sin|cos|tan|tg|cot|ctg|log|ln|lg|exp|arcsin|arccos|arctan|arctg)\b/g, '$1')
         .replace(/\\/g, ' ').replace(/\{/g, '(').replace(/\}/g, ')');
    s = s.replace(/[−–—]/g, '-').replace(/[×·⋅∙•*]/g, '*').replace(/[÷:]/g, '/').replace(/[（]/g, '(').replace(/[）]/g, ')')
         .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, function (m) { return '^(' + m.split('').map(function (c) { return SUP[c]; }).join('') + ')'; })
         .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, function (m) { return '_' + m.split('').map(function (c) { return SUB[c]; }).join(''); })
         .replace(/(\d)\s*,\s*(?=\d)/g, function (m, d) { return /\s/.test(m) ? m : d + '.'; })
         .replace(/\*\*/g, '^').replace(/(^|[^a-zа-яіїєґ])х/gi, '$1x').replace(/(^|[^a-zа-яіїєґ])у/gi, '$1y')
         .replace(/[Хх](?![а-яіїєґ])/g, 'x').replace(/[Уу](?![а-яіїєґ])/g, 'y');
    return s.toLowerCase().replace(/\s+/g, ' ').trim();
  }

  // ---------- tokens ----------
  function tokens(s) {
    var out = [], i = 0, m;
    while (i < s.length) {
      var c = s[i];
      if (c === ' ') { i++; continue; }
      if ((m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)))) { out.push({ t: 'n', v: parseFloat(m[1]), s: m[1].replace(/\.$/, '') }); i += m[1].length; continue; }
      if ((m = /^[a-z]+/.exec(s.slice(i)))) {
        var w = m[0]; i += w.length;
        while (w) {
          var f = null;

    svgEl('line', { x1: cx, y1: cy - 10, x2: cx, y2: cy + 10, stroke: '#173f57' }, svg);
    svgEl('circle', { cx: cx, cy: cy, r: 2.5, fill: '#b3121f' }, svg);
    svgEl('circle', { 'class': 'rot', cx: cx + R - 8, cy: cy + 7, r: 8, fill: '#fff', stroke: '#0f6d8c', 'stroke-width': 2 }, svg);
    closeMark(svg, cx - R + 10, cy + 7);
    return instrument('protractor', svg, W, H, [cx, cy]);
  }

  /** Under the question text: "no translation" note, and the translation button of English tests. */
  function qExtras(card, q) {
    if ([q.q, q.note].concat(q.options || [], q.left || [], q.right || []).some(txMissing)) card.appendChild(el('p', 'miss', t('no_translation')));
    if (q.img) { var im = document.createElement('img'); im.className = 'qimg'; im.alt = ''; im.src = q.img; card.appendChild(im); }
    if (!(TEST.mode === 'translate' && TEST.allowTranslate)) return;
    var box = el('div');
    function showTr(tr) {
      box.textContent = '';
      var b = el('div', 'trbox'); b.appendChild(el('b', null, t('tr_title')));
      b.appendChild(el('div', null, tr.q || t('tr_fail')));
      if (tr.instructions) b.appendChild(el('div', 'hint', tr.instructions));
      box.appendChild(b);
    }
    if (TRSHOWN[q.id] && TRC[q.id]) showTr(TRC[q.id]);
    else {
      var btn = el('button', 'trbtn', t('tr_btn')); btn.type = 'button';
      btn.addEventListener('click', function () {
        btn.disabled = true; btn.textContent = t('tr_loading');
        var got = function (tr) {
          TRC[q.id] = tr;
          if (!TRSHOWN[q.id]) { TRSHOWN[q.id] = true; act.translateCount++; logEv('translate', { x: tx(q.q).slice(0, 200) }); saveSoon(); }
          if (ORDER[POS] && ORDER[POS].q.id === q.id) showTr(tr);
        };
        if (TRC[q.id]) return got(TRC[q.id]);
        call('translateQuestion', [A.id, q.id], 2).then(got).catch(function (err) { btn.disabled = false; btn.textContent = t('tr_btn'); toast(userMsg(err) || t('tr_fail')); });
      });
      box.appendChild(btn);
    }
    card.appendChild(box);
  }
  /** "2H2 + O2 = 2H2O" -> "2H₂ + O₂ → 2H₂O" (only for the student's own preview of a formula answer). */
  function prettyChem(v) {
    var SUB = '₀₁₂₃₄₅₆₇₈₉';
    return String(v).replace(/\s*(<=>|<->|->|=>|=|→)\s*/g, function (m, a) { return /</.test(a) ? ' ⇌ ' : ' → '; })
      .replace(/\s*\+\s*/g, ' + ').replace(/ \+ $/, ' +')
      .replace(/([A-Za-zА-Яа-яІі)\]])(\d+)/g, function (m, a, d) { return a + d.split('').map(function (c) { return SUB[+c]; }).join(''); });
  }
  /** If mhchem could not load from the CDN, draw $\ce{…}$ with plain LaTeX so formulas still look right. */
  function ceFallback(root) {
    if (window.__mhchem || !root || !document.createTreeWalker) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, list = [];
    while ((n = w.nextNode())) if (n.nodeValue.indexOf('\\ce{') >= 0 && !(n.parentNode && /^(TEXTAREA|INPUT)$/.test(n.parentNode.nodeName))) list.push(n);
    list.forEach(function (node) {
      node.nodeValue = node.nodeValue.replace(/\\ce\{((?:[^{}]|\{[^{}]*\})*)\}/g, function (m, x) {
        return '\\mathrm{' + x.replace(/([A-Za-z)\]])(\d+)/g, '$1_{$2}').replace(/\^(\d*[+-])/g, '^{$1}')
          .replace(/\s*(<=>|<->)\s*/g, ' \\rightleftharpoons ').replace(/\s*->\s*/g, ' \\rightarrow ').replace(/\s+\+\s+/g, ' + ') + '}';
      });
    });
  }
  function renderMath(root) {
    if (!root || (TEST && TEST.formulas === false)) return;
    if (window.renderMathInElement) {
      ceFallback(root);
      try { window.renderMathInElement(root, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }, { left: '\\(', right: '\\)', display: false }, { left: '\\[', right: '\\]', display: true }], throwOnError: false, ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'input', 'select', 'option'] }); } catch (e) {}
    } else { window.__mathPending = function () { renderMath(root); }; }
  }
  function paintGap(q) { var g = $('gap'); if (!g) return; var v = ans[q.id]; if (typeof v !== 'number') { g.textContent = '______'; g.classList.add('empty'); } else { g.textContent = tx(q.options[v]); g.classList.remove('empty'); renderMath(g); } }
  function grow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; }

  $('nextBtn').addEventListener('click', function () {
    var item = ORDER[POS], q = item.q;
    if (!isAnswered(item)) {
      $('quizErr').textContent = q.type === 'mc' ? t('err_choose') : q.type === 'match' ? t('err_match') : q.type === 'solve' ? t('err_roots') : q.type === 'fix' ? t('err_fix') : t('err_write');
      var ta = $('ta'); if (ta) ta.focus(); return;
    }
    $('quizErr').textContent = ''; saveSoon();
    if (POS === ORDER.length - 1) return finish();
    POS++; renderQ();
  });
  $('finishBtn').addEventListener('click', function () { if (!FINISHED) finish(); });

  var saveTO = null;
  function saveSoon() { clearTimeout(saveTO); saveTO = setTimeout(function () { if (!A || FINISHED) return; call('saveProgress', [A.id, ans, snapshotAct()], 1).then(function (r) { if (r && r.deadline) A.deadline = r.deadline; }).catch(function () {}); }, 400); }

  function finish() {
    var blanks = 0; ORDER.forEach(function (it) { if (!isAnswered(it)) blanks++; });
    $('cBack').textContent = t('go_back'); $('cSend').textContent = t('submit');
    $('confirmText').textContent = blanks ? t('confirm_unanswered', { n: blanks }) : t('confirm_submit');
    var d = $('confirm'); if (d.showModal) d.showModal(); else if (confirm($('confirmText').textContent)) send();
  }
  $('cBack').addEventListener('click', function () { $('confirm').close(); });
  $('cSend').addEventListener('click', function () { $('confirm').close(); send(); });

  function send() {
    if (SENDING || FINISHED) return;
    SENDING = true; FINISHED = true; stopTimer(); comeBack(); stopTracking(); closeTools();
    message('⏳', t('sending'), t('please_wait'));
    call('submitAttempt', [A.id, ans, snapshotAct()]).then(function (res) {
      store.del(activeKey()); showDone('thanks', A.name, res && res.score);
    }).catch(function (err) {
      SENDING = false; FINISHED = false; var m = userMsg(err);
      repaint = function () { message('⚠️', t('send_fail'), (m || t('connect_fail_text')) + ' ' + t('send_fail_text'), {}); $('msgRetry').classList.remove('hidden'); $('msgRetry').onclick = function () { SENDING = false; send(); }; };
      repaint();
    });
  }
  function showDone(kind, name, score) {
    repaint = function () { showDone(kind, name, score); };
    show('doneView'); $('topbar').classList.add('hidden'); $('pbarWrap').classList.add('hidden');
    $('doneTitle').textContent = t('done_title');
    $('doneName').textContent = kind === 'timeup' ? t('times_up_done', { name: name }) : t('thank_you', { name: name });
    $('doneClose').textContent = t('can_close');
    if (score) { $('doneScore').classList.remove('hidden'); $('scoreTotal').textContent = score.score + ' / ' + score.max; }
    else $('doneScore').classList.add('hidden');
  }

  // ---------- timer ----------
  var tmr = null;
  function startTimer() { stopTimer(); if (!A.deadline) { $('timer').classList.add('hidden'); return; } $('timer').classList.remove('hidden'); tick(); tmr = setInterval(tick, 1000); }
  function stopTimer() { clearInterval(tmr); tmr = null; }
  function tick() { if (!A.deadline) return; var left = A.deadline - now(); $('timer').textContent = fmt(left); $('timer').classList.toggle('low', left <= 60000);
    if (left <= 0) { stopTimer(); $('timer').textContent = '0:00'; if (!FINISHED) { FINISHED = true; SENDING = true; comeBack(); stopTracking(); closeTools(); autoSend(); } } }
  function autoSend() {
    message('⏰', t('times_up'), t('sending'));
    call('submitAttempt', [A.id, ans, snapshotAct()]).then(function () { store.del(activeKey()); showDone('timeup', A.name, null); })
      .catch(function () { repaint = function () { message('⚠️', t('send_fail'), t('connect_fail_text') + ' ' + t('send_fail_text'), {}); $('msgRetry').classList.remove('hidden'); $('msgRetry').onclick = function () { SENDING = false; FINISHED = false; send(); }; }; repaint(); });
  }

  // ---------- activity (only if monitor on; disclosed on intro) ----------
  function atSec() { return Math.max(0, Math.round((now() - START) / 1000)); }
  function logEv(ty, extra) { if (act.log.length < 200) { var e = { t: ty, at: atSec() }; if (extra) for (var k in extra) e[k] = extra[k]; act.log.push(e); } }
  function snapshotAct() { return { leftCount: act.leftCount, leftMs: act.leftMs, copyCount: act.copyCount, pasteCount: act.pasteCount, tools: act.tools, translateCount: act.translateCount, langs: act.langs.slice(), log: act.log.slice(-80) }; }
  function goAway() { if (away || !inTest || FINISHED) return; away = true; awayStart = now(); }
  function comeBack() { if (!away) return; away = false; if (FINISHED) return; var d = now() - awayStart; act.leftCount++; act.leftMs += d; logEv('leave', { d: Math.round(d) }); saveSoon(); }
  function onVis() { if (document.hidden) goAway(); else comeBack(); }
  function onCopy() { if (!inTest || FINISHED) return; act.copyCount++; var sel = ''; try { sel = String(window.getSelection() || ''); } catch (e) {} logEv('copy', { x: sel.slice(0, 200) }); saveSoon(); }
  function onPaste(e) { if (!inTest || FINISHED) return; e.preventDefault(); act.pasteCount++; logEv('paste'); saveSoon(); toast(t('paste_off')); }
  function startTracking() { if (inTest) return; inTest = true; START = now();
    document.addEventListener('visibilitychange', onVis); window.addEventListener('blur', goAway); window.addEventListener('focus', comeBack);
    document.addEventListener('copy', onCopy, true); document.addEventListener('paste', onPaste, true); }
  function stopTracking() { inTest = false;
    document.removeEventListener('visibilitychange', onVis); window.removeEventListener('blur', goAway); window.removeEventListener('focus', comeBack);
    document.removeEventListener('copy', onCopy, true); document.removeEventListener('paste', onPaste, true); }
  var toastEl = null, toastTO = null;
  function toast(m) { if (!toastEl) { toastEl = el('div'); toastEl.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none'; document.body.appendChild(toastEl); } toastEl.textContent = m; toastEl.style.opacity = '1'; clearTimeout(toastTO); toastTO = setTimeout(function () { toastEl.style.opacity = '0'; }, 2800); }

  load();
})();
</script>
