<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пароль — Kvizora</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/rpc.js"></script>
</head>
<body>
<header><div class="wrap"><h1>Kvizora<small id="who"></small></h1><button class="btn head" id="logout" type="button">Вийти</button></div></header>
<main>
  <div class="card auth">
    <h2 id="title">Змініть пароль</h2>
    <p class="muted" style="font-size:14px;margin-top:0" id="intro">Адміністратор дав вам тимчасовий пароль. Придумайте власний — його знатимете лише ви.</p>
    <form id="form">
      <input type="text" id="user" autocomplete="username" hidden>
      <label for="old">Поточний (тимчасовий) пароль</label><input id="old" type="password" autocomplete="current-password" required>
      <label for="pw">Новий пароль (щонайменше 8 символів)</label><input id="pw" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
      <label for="pw2">Повторіть новий пароль</label><input id="pw2" type="password" autocomplete="new-password" maxlength="200" required>
      <div id="terms" class="terms" hidden>
        <p class="muted" id="changed" hidden style="font-size:13px;margin:0 0 8px">Що змінилося: додано <a href="/legal/terms#6в" target="_blank">п. 6в</a> (доступ батьків за кодом, оголошення класу, банк тестів школи, вивантаження журналу).</p>
        <label class="consent"><input type="checkbox" id="t1"><span>Мені виповнилося 18 років. Я приймаю <a href="/legal/terms" target="_blank">Умови використання</a> та ознайомився(-лась) з <a href="/legal/privacy" target="_blank">Політикою конфіденційності</a>.</span></label>
        <label class="consent"><input type="checkbox" id="t2"><span>Я використовую Kvizora від імені закладу освіти, який поінформував учнів і батьків про обробку їхніх даних, або беру цю відповідальність на себе.</span></label>
      </div>
      <button class="btn solid wide" id="go" type="submit">Зберегти пароль</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
</main>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var E = { su_pw: 'Пароль — щонайменше 8 символів.', pw_weak: 'Пароль занадто простий (або збігається з логіном). Оберіть інший.', pw_old: 'Поточний пароль невірний.',
    pw_same: 'Новий пароль має відрізнятися від поточного.', rate: 'Забагато спроб. Зачекайте хвилину.', terms: 'Позначте обидві галочки.' };
  var needTerms = false, onlyTerms = false;
  window.api('/api/auth/me').then(function (me) {
    $('who').textContent = me.name + ' · ' + me.login; $('user').value = me.login;
    needTerms = !!me.needTerms; $('terms').hidden = !needTerms; $('changed').hidden = !me.termsChanged;
    if (needTerms && !me.mustChange) {   // the password is already the teacher's own: only the Terms are asked
      onlyTerms = true; $('title').textContent = 'Умови використання'; $('intro').textContent = me.termsChanged ? 'Умови використання Kvizora оновилися. Щоб продовжити роботу, прийміть їх ще раз. Ваші дані нікуди не зникнуть.' : 'Перед роботою прийміть Умови використання Kvizora.';
      ['old', 'pw', 'pw2'].forEach(function (id) { var i = $(id); i.required = false; i.hidden = true; i.previousElementSibling.hidden = true; });
      $('go').textContent = 'Продовжити';
    } else if (!me.mustChange) { $('title').textContent = 'Змінити пароль'; $('intro').textContent = ''; $('old').previousElementSibling.textContent = 'Поточний пароль'; }
  }, function () { location.href = '/login'; });
  $('logout').onclick = function () { window.api('/api/auth/logout').then(function () { location.href = '/login'; }); };
  $('form').addEventListener('submit', function (e) {
    e.preventDefault(); $('err').textContent = '';
    if (needTerms && !($('t1').checked && $('t2').checked)) { $('err').textContent = E.terms; return; }
    if (!onlyTerms && $('pw').value !== $('pw2').value) { $('err').textContent = 'Паролі не збігаються.'; return; }
    var b = $('go'); b.disabled = true;
    var acc = needTerms ? { terms: $('t1').checked, schoolOk: $('t2').checked } : {};
    (onlyTerms ? window.api('/api/auth/accept', acc) : window.api('/api/auth/password', Object.assign({ old: $('old').value, password: $('pw').value }, acc))).then(function (r) { location.href = r.next || '/'; })
      .catch(function (err) { b.disabled = false; var c = /\[#([a-z_]+)\]/.exec(String(err.message)); $('err').textContent = (c && E[c[1]]) || String(err.message).replace(/^USER:\s*/, ''); });
  });
})();
</script>
</body>
</html>
